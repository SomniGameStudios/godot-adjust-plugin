name: "[CI] Build"

# Compile the Android and iOS plugin binaries on every pull request so that a
# change that breaks the native build is caught before review/merge. This is a
# smoke test only: it mirrors the release build steps but does not sign,
# version, or publish anything. No secrets are required, so it also runs safely
# on pull requests from forks.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot version to build against (e.g. 4.6.2)'
        required: false
        default: '4.6.2'

# Only keep the latest run per ref; cancel superseded runs to save minutes.
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.6.2' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('platforms/android/**/*.gradle', 'platforms/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android AARs
        working-directory: platforms/android
        run: |
          chmod +x gradlew
          ./gradlew build -PgodotVersion="$GODOT_VERSION"
          ./gradlew exportFiles -PpluginExportPath=../../platforms/godot_editor/addons/adjust/android/bin

      - name: Upload Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: platforms/godot_editor/addons/adjust/android/bin/
          if-no-files-found: error
          retention-days: 3

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    env:
      GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.6.2' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python3 -m pip install scons

      # The generated Godot headers (gitignored) are the slow part of the build;
      # cache them per Godot version + generator script so reruns skip the
      # download + scons header generation.
      - name: Cache Godot headers
        uses: actions/cache@v4
        with:
          path: platforms/ios/include
          key: godot-headers-${{ env.GODOT_VERSION }}-${{ hashFiles('platforms/ios/scripts/download_and_generate_headers.sh') }}

      - name: Generate Godot headers
        working-directory: platforms/ios
        run: |
          if [ ! -d include/godot ]; then
            chmod +x scripts/download_and_generate_headers.sh
            ./scripts/download_and_generate_headers.sh
          else
            echo "Godot headers restored from cache; skipping generation."
          fi

      - name: Build iOS XCFramework
        working-directory: platforms/ios
        run: ./scripts/build.sh "$GODOT_VERSION"

      - name: Upload iOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: platforms/godot_editor/ios/plugins/adjust/
          if-no-files-found: error
          retention-days: 3
