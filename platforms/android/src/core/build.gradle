plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.somnigamestudios.godot.adjust.core'
    
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "AdjustGodotPlugin-${variant.name}.aar"
        }
    }
}

dependencies {
    compileOnly "org.godotengine:godot:4.6.2.stable"
    
    implementation "com.adjust.sdk:adjust-android:5.6.0"
    implementation "com.adjust.sdk:adjust-android-meta-referrer:5.6.0"
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation "com.google.android.gms:play-services-ads-identifier:18.0.1"
}
