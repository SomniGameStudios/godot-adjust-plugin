site_name: Godot Adjust Plugin - Somni Game Studios
site_url: https://somnigamestudios.github.io/godot-adjust-plugin/
repo_url: https://github.com/SomniGameStudios/godot-adjust-plugin
repo_name: SomniGameStudios/godot-adjust-plugin

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: teal
      accent: teal
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: teal
  features:
    - content.code.copy
    - content.code.annotation
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - toc:
      title: On this page
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list

plugins:
  - search

nav:
  - Introduction: index.md
  - API Reference: gdscript_api.md
  - Testing Guide: testing.md
  - Android: android.md

copyright: |
  &copy; 2026-present <a href="https://github.com/SomniGameStudios" target="_blank" rel="noopener">Somni Game Studios</a>


